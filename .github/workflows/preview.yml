name: EAS Preview Build

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

# Preview builds cost EAS credits; superseded pushes should not keep building.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview Build (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fail fast with a readable message instead of a confusing eas-cli auth error.
      - name: Verify EXPO_TOKEN is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create a personal access token at https://expo.dev/settings/access-tokens and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      # Android only: no Apple credentials are provisioned yet, so --platform all
      # would fail the iOS half of every run.
      # --no-wait queues the build and exits, instead of billing Actions minutes
      # for the 20-40 minutes EAS spends building.
      - name: EAS Preview Build
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait \
            --message "${{ github.event.head_commit.message || github.ref_name }}"
