name: EAS Preview Build

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

# Preview builds cost EAS credits; superseded pushes should not keep building.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview Build (Android)
    runs-on: ubuntu-latest
    # The run now waits for EAS, so cap it well above a normal build (20-40 min)
    # rather than letting a stuck build hold a runner for the 6 hour default.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fail fast with a readable message instead of a confusing eas-cli auth error.
      - name: Verify EXPO_TOKEN is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create a personal access token at https://expo.dev/settings/access-tokens and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      # Cancelling this workflow run does NOT stop a running EAS build: eas-cli
      # has no signal handler for it ("press Ctrl+C to exit" leaves the build
      # going), so concurrency.cancel-in-progress cannot reclaim EAS credits on
      # its own. Superseded builds must be cancelled explicitly, by id, because
      # `eas build:cancel` refuses to run without one in non-interactive mode.
      - name: Cancel superseded preview builds
        run: |
          IDS=$(for STATUS in new in-queue in-progress; do
            eas build:list \
              --platform android \
              --build-profile preview \
              --status "$STATUS" \
              --limit 50 \
              --non-interactive \
              --json 2>/dev/null \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{JSON.parse(s).forEach(b=>console.log(b.id))}catch(e){}})"
          done | sort -u)
          if [ -z "$IDS" ]; then
            echo "No preview builds in flight."
          else
            for ID in $IDS; do
              echo "Cancelling superseded build $ID"
              eas build:cancel "$ID" --non-interactive || echo "  could not cancel $ID (likely finished already)"
            done
          fi

      # Android only: no Apple credentials are provisioned yet, so --platform all
      # would fail the iOS half of every run.
      # Deliberately NOT --no-wait: waiting is what makes this run report whether
      # the build actually succeeded. With --no-wait the job goes green as soon
      # as the build is queued, so a failed build shows up as a passing check.
      - name: EAS Preview Build
        env:
          # Passed as an environment variable, never interpolated into the script.
          # A commit message is arbitrary multi-line text: the message for 56fcb40
          # contained a double quote, which closed the --message string early and
          # left stray words as arguments ("Unexpected arguments: for, build, to").
          # Interpolating repository-controlled text into a run block is also the
          # classic Actions script-injection vector.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # EAS wants a one-line label; take the subject and cap its length.
          MSG=$(printf '%s' "${COMMIT_MESSAGE:-$REF_NAME}" | head -n 1 | cut -c1-180)
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --message "$MSG"
