version: 2
updates:
  # Stale Expo SDK patch versions are what broke `expo-doctor` in CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
      react-navigation:
        patterns:
          - '@react-navigation/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
